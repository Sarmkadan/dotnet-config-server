name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet-config-server.sln

      - name: Build
        run: dotnet build dotnet-config-server.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test dotnet-config-server.sln --no-build --configuration Release --verbosity normal
